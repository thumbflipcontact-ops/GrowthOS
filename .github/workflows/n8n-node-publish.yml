name: n8n node publish

# Tag prefix is scoped to this package specifically (n8n-nodes-threadly-v*), not a bare
# semver tag — this repo is a monorepo and other parts of it may want their own tagging
# scheme later without colliding with this one.
on:
  push:
    tags:
      - "n8n-nodes-threadly-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n-nodes-threadly
    # id-token: write is required to mint the OIDC token npm's provenance/Trusted Publisher
    # flow uses — see https://docs.npmjs.com/generating-provenance-statements
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
