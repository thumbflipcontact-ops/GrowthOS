[project]
name = "growthos-plugin-dummy"
version = "0.0.1"
description = "Phase 1 test fixture proving plugin discovery — not a real plugin, see README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.entry-points."growthos.plugins"]
dummy = "plugins.dummy.manifest:MANIFEST"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plugins.dummy"]
package-dir = {"plugins.dummy" = "."}
