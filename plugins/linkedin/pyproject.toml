[project]
name = "growthos-plugin-linkedin"
version = "0.1.0"
description = "GrowthOS plugin: LinkedIn (Publishable, OAuth2)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "httpx>=0.28.1,<0.29"]

[project.entry-points."growthos.plugins"]
linkedin = "plugins.linkedin.manifest:MANIFEST"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plugins.linkedin"]
package-dir = {"plugins.linkedin" = "."}
